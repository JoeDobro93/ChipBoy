name: CI

# Actions minutes are scarce on a private repository (a macOS runner counts
# ten times, Windows twice), and every gate already runs locally before a
# push (CLAUDE.md, "Verification runs here"). So a push to main runs only
# the L1 rule check. The builds run when asked for -- Actions -> CI ->
# "Run workflow" with the platforms you want, or a v* tag, which builds all.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Which runners build and test
        type: choice
        default: linux
        options: [linux, windows, macos, all]

# A newer push or dispatch on the same ref cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Spec rule L1: Source/core links nothing and includes nothing but the
  # standard library and its own headers. Enforced here so it cannot erode.
  core-links-nothing:
    name: L1 core links nothing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source/core includes only <std> and "core/..."
        shell: bash
        run: |
          bad=0
          while IFS= read -r line; do
            inc=$(printf '%s' "$line" | sed -E 's/.*#include[[:space:]]*//')
            case "$inc" in
              \<*\>)  ;;                       # standard library
              \"core/*) ;;                     # our own headers
              *) echo "L1 violation: $line"; bad=1 ;;
            esac
          done < <(grep -rEn '^[[:space:]]*#include' Source/core)
          if grep -rEin 'juce' Source/core; then echo "L1 violation: JUCE referenced in Source/core"; bad=1; fi
          exit $bad

  # Which runners this run builds on: the dispatch input, every platform for
  # a tag, none for an ordinary push.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          PLATFORMS: ${{ github.event.inputs.platforms }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          p="$PLATFORMS"; [ "$IS_TAG" = "true" ] && p=all
          case "$p" in
            linux)   m='["ubuntu-latest"]' ;;
            windows) m='["windows-latest"]' ;;
            macos)   m='["macos-latest"]' ;;
            all)     m='["ubuntu-latest","macos-latest","windows-latest"]' ;;
            *)       m='[]' ;;
          esac
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "building on $m"

  build-and-test:
    name: ${{ matrix.os }}
    needs: [core-links-nothing, plan]
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # RGBDS assembles the SameSuite ROMs (cmake/TestRoms.cmake). Without it
      # those tests are skipped, so its absence would silently shrink the gate.
      - name: Install RGBDS (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o rgbds.tar.xz https://github.com/gbdev/rgbds/releases/download/v0.9.2/rgbds-0.9.2-linux-x86_64.tar.xz
          mkdir -p "$HOME/rgbds" && tar -xJf rgbds.tar.xz -C "$HOME/rgbds"
          echo "$HOME/rgbds" >> "$GITHUB_PATH"
      - name: Install RGBDS (macOS)
        if: runner.os == 'macOS'
        run: brew install rgbds
      - name: Install RGBDS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/gbdev/rgbds/releases/download/v0.9.2/rgbds-0.9.2-win64.zip -OutFile rgbds.zip
          Expand-Archive rgbds.zip -DestinationPath "$env:USERPROFILE\rgbds"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\rgbds"
      - name: RGBDS version
        run: rgbasm --version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  plugins:
    name: plugins ${{ matrix.os }}
    needs: [core-links-nothing, plan]
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev libcurl4-openssl-dev
      - name: ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache

      # JUCE is most of the build; a warm ccache turns the hour into minutes.
      # Windows/MSVC is left uncached: ccache's MSVC support does not cover
      # the flags JUCE uses.
      - name: ccache store
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ccache' || '~/.cache/ccache' }}
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            ccache-${{ runner.os }}-

      - name: Configure
        shell: bash
        run: |
          launcher=""
          if [ "$RUNNER_OS" != "Windows" ]; then launcher="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCHIPBOY_BUILD_PLUGIN=ON -DCHIPBOY_BUILD_TESTS=OFF $launcher
      - name: Build (VST3, Standalone, tools)
        run: cmake --build build --config Release --parallel --target ChipBoy_VST3 ChipBoyVoice_VST3 ChipBoy_Standalone chipboy_paramdump chipboy_linktest chipboy_recordtest
      - name: Build (AU)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --parallel --target ChipBoy_AU ChipBoyVoice_AU
      - name: ccache statistics
        if: runner.os != 'Windows'
        run: ccache -s
      - name: Link and record integration tests
        run: ctest --test-dir build -C Release -R "linktest|recordtest" --output-on-failure
      - name: Link test stages (on failure)
        if: failure()
        shell: bash
        run: find build -name 'chipboy_linktest.stages.txt' -exec cat {} \; || true
      - name: Parameter table matches the demo generator
        shell: bash
        run: |
          dump=$(find build -type f -name 'chipboy_paramdump*' -perm -u+x | grep -v '\.o$' | head -1)
          python3 tools/demo/make_demo.py --out build/demo-check --paramdump "$dump"
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: chipboy-${{ matrix.os }}
          path: |
            build/ChipBoy_artefacts/Release
            build/ChipBoyVoice_artefacts/Release
